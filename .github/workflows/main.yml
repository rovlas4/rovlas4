name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Metricas
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: rovlas4
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Mexico_City

          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage

          plugin_lines: yes

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_habits: no

      - name: Canciones recientes
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-spotify-recent.svg
          token: NOT_NEEDED
          base: ""
          plugin_music: yes
          plugin_music_provider: spotify
          plugin_music_mode: recent
          plugin_music_token: ${{ secrets.SPOTIFY_TOKENS }}
          plugin_music_limit: 4

      - name: Top Canciones Spotify
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-spotify-top.svg
          token: NOT_NEEDED 
          base: "" 
          plugin_music: yes
          plugin_music_provider: spotify
          plugin_music_mode: top
          plugin_music_top_type: tracks
          plugin_music_time_range: short
          plugin_music_token: ${{ secrets.SPOTIFY_TOKENS }}
          plugin_music_limit: 4

      - name: Top Artistas Spotify
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-spotify-top-artists.svg
          token: NOT_NEEDED
          base: ""
          plugin_music: yes
          plugin_music_provider: spotify
          plugin_music_mode: top
          plugin_music_top_type: artists
          plugin_music_time_range: short
          plugin_music_token: ${{ secrets.SPOTIFY_TOKENS }}
          plugin_music_limit: 4
